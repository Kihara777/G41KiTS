# Stakater Reloader：证书轮换后自动滚动重启标注的 Deployment
# （替代 acme.sh 的 DEPLOY_DOCKER_CONTAINER_RELOAD_CMD 钩子）。
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: reloader
  namespace: kube-system
spec:
  chart: reloader
  repo: https://stakater.github.io/stakater-charts
  targetNamespace: reloader
  createNamespace: true
  version: v2.2.0
