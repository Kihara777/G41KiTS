# 部署 GitHub 仓库的共有内容到 VPS（k3s 模式）
# 所需 secrets（Settings → Secrets and variables → Actions）：
#   VPS_HOST     — VPS 主机名/IP（如 g41.moe）
#   VPS_USER     — SSH 用户（如 root）
#   VPS_SSH_KEY  — 部署专用私钥（对应 VPS 上 authorized_keys）
#   VPS_PATH     — 仓库根（如 /root/G41KiTS）
# .gitignore 的私有内容（.env、kits/*/.local）不经此处，用 deploy-local.sh 手动推送
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 2026-11-12 加：只在「这次 run 的提交就是当前 main」时部署。
      #
      # 起因：Actions 排队四个多小时，期间积压了多个 run。队列恢复后如果按顺序执行，
      # 一个针对**旧提交**的 run 会 checkout 旧树再 rsync --delete —— **把生产拉回旧版本**，
      # 而且看起来像一次正常的部署。
      #
      # 宁可红，也不要把线上改回旧代码：红是可见的，倒退是安静的。
      - name: 只部署最新的 main
        run: |
          git fetch --depth=1 origin main
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/main)
          echo "本次 run: $LOCAL"
          echo "origin/main: $REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::这个 run 针对 $LOCAL，而 origin/main 已是 $REMOTE —— 跳过部署，避免把生产拉回旧版本"
            exit 1
          fi

      - name: Sync public content over SSH (rsync)
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: ${{ secrets.VPS_PATH }}
          ARGS: "-rlgoDz --delete --exclude=.git --exclude=.*/ --exclude=.env --exclude=.local.sh --exclude=*.bak --exclude=G41KiTS_*.tar.gz --exclude=.deepseek"
          EXCLUDE: ""

      - name: Apply on VPS (nginx conf + workloads)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            ./g41.sh k8s conf
            # 内容种子必须由仓库现生成再应用（2026-11-09）：
            # `g41-content` 此前是我手工 apply 的，全新部署不会带上它，
            # 而 tile/i18n 的内容解析已经只靠它。顺序在 workloads 之前——
            # redis 的清单引用这张 ConfigMap，先有内容再有消费者。
            ./g41.sh kits content
            kubectl apply -f dist/g41-content.yaml
            # api 源码同样由仓库现生成（2026-11-09）：它原先挂在宿主机单文件上，
            # 靠人手工 cp——而实测两者 inode 不同源，改仓库不等于改运行的那份。
            ./g41.sh kits api-src
            kubectl apply -f dist/g41-api-src.yaml
            ./g41.sh k8s apply --all
