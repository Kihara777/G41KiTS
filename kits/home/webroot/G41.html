<style>
/* ═══ 首屏样式**全部内联**：零额外请求、且不被外部样式表阻塞渲染 ═══
   为什么：以前是 3 个 <link rel="stylesheet">（base/tiles/hc，共 ~15KB）。浏览器为了
   它们会**推迟首次绘制**——HTML 到了也只是白屏，启动环要等样式回来才画得出来。
   维护者的原话：「加载页应该像 splashscreen 那样被优先载入」。
   内联之后：HTML 一到就能画环（唯一的请求就是 HTML 自己）；顺带省掉 3 次往返。
   高对比主题（原 hc.css）在最后，层叠顺序与以前一致。
   改样式就改这个文件——仓库里不再有独立的 .css 源文件（避免两份漂移）。 */
/* ═══════════ base.css（自 2026-10-12 起内联于此） ═══════════ */
/* ═══════════ CSS: base ═══════════ */
:root{
  --wp-lime:#a4c400;--wp-green:#60a917;--wp-emerald:#008a00;--wp-teal:#00aba9;
  --wp-cyan:#1ba1e2;--wp-cobalt:#0050ef;--wp-indigo:#6a00ff;--wp-violet:#aa00ff;
  --wp-magenta:#d80073;--wp-red:#e51400;--wp-orange:#fa6800;--wp-amber:#f0a830;
  --wp-yellow:#e3c800;--wp-brown:#825a2c;--wp-olive:#6d8764;--wp-steel:#647687;--wp-mauve:#76608a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh}
body{font-family:'Segoe UI','Segoe WP','Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;background:#000;color:#fff;display:flex;flex-direction:column}
#g41-bg{position:fixed;inset:0;z-index:0;background:#000}
#g41-bg img{width:100%;height:100%;object-fit:cover;opacity:.25;filter:blur(1px);transition:opacity .4s ease,filter .4s ease}
#g41-app{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
.g41-view{flex:1;display:none;flex-direction:column}
.g41-view--active{display:flex}
.g41-view--slide-in{animation:wp-slide-in .35s cubic-bezier(.2,0,0,1) both}
.g41-view--slide-out{animation:wp-slide-out .25s cubic-bezier(.5,0,.7,.2) both}
@keyframes wp-slide-in{from{transform:translateX(100%);opacity:.5}to{transform:translateX(0);opacity:1}}
@keyframes wp-slide-out{from{transform:translateX(0);opacity:1}to{transform:translateX(-40%);opacity:0}}
#g41-view-main{display:none;flex-direction:column;padding:0}
#g41-view-main.g41-view--active{display:flex}
.main-entry{animation:main-entry .6s cubic-bezier(.16,1,.3,1) both}
@keyframes main-entry{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#g41-header{padding:1.5rem 1.5rem .3rem;flex-shrink:0;display:flex;justify-content:space-between;align-items:flex-start}
.h-title{font-size:3.5rem;font-weight:200;letter-spacing:8px;line-height:1;text-transform:uppercase}
.h-controls{display:flex;gap:.3rem;flex-shrink:0;align-items:flex-start}
.h-btn{background:transparent;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);width:2rem;height:2rem;font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0}
.h-btn:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.lang-drop{position:relative}
.lang-menu{position:absolute;top:100%;right:0;margin-top:.25rem;flex-direction:row;gap:.15rem;background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.15);padding:.25rem;opacity:0;transform:translateY(-.3rem);pointer-events:none;transition:opacity .15s ease,transform .15s ease}
.lang-menu.open{opacity:1;transform:translateY(0);pointer-events:auto;display:flex}
.lang-opt{background:transparent;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);width:2rem;height:2rem;font-size:.7rem;font-weight:700;cursor:pointer;padding:0}
.lang-opt:hover,.lang-opt.active{color:#fff;border-color:var(--wp-amber)}
.h-sub{font-size:1rem;font-weight:400;color:rgba(255,255,255,.45);padding:.15rem 1.5rem 0;letter-spacing:1px;min-height:1.4rem}
.h-sub.err{color:#fff;text-align:center;padding:2rem 2rem 0;line-height:1.7;white-space:normal;word-break:keep-all;overflow-wrap:break-word;font-size:1.4rem;flex:1;display:flex;align-items:center;justify-content:center;margin:0}
#g41-character{text-align:center;flex-shrink:0;display:none;padding:0 1.5rem}
#g41-character.on{display:block}
#g41-character img{max-width:min(260px,60vw);max-height:30vh;height:auto}
#g41-character figcaption{margin-top:.3rem;font-size:.85rem;font-weight:300;color:rgba(255,255,255,.6);font-style:italic}
#g41-view-detail{flex:1;display:none;flex-direction:column;padding:1.5rem 1.5rem 1rem}
#g41-view-detail.g41-view--active{display:flex}
.detail-header{display:flex;align-items:center;gap:.8rem;flex-shrink:0;margin-bottom:1rem}
.d-back{background:none;color:#fff;border:2px solid rgba(255,255,255,.25);width:2.5rem;height:2.5rem;font-size:1.3rem;cursor:pointer;line-height:1;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.d-back:hover{background:rgba(255,255,255,.1)}
.d-title{font-size:1.5rem;font-weight:200;text-transform:lowercase;letter-spacing:3px}
.detail-body{flex:1;line-height:1.7;font-weight:300;padding-right:.5rem;transition:opacity .2s ease}
.detail-body.fade-in{animation:detail-fade .2s ease both}
@keyframes detail-fade{from{opacity:0;transform:translateY(.5rem)}to{opacity:1;transform:translateY(0)}}
.detail-body h3{font-size:1.1rem;font-weight:400;text-transform:lowercase;margin:1.5rem 0 .5rem;padding-bottom:.2rem;border-bottom:1px solid rgba(255,255,255,.15)}
.detail-body p,.detail-body li{margin-bottom:.45rem;font-size:.9rem}
.detail-body ul{padding-left:1.3rem}
.detail-body pre{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:.7rem;overflow-x:auto;font-size:.78rem;line-height:1.5;margin:.4rem 0}
.detail-body code{font-family:'Cascadia Code','Fira Code',monospace;font-size:.78rem}
.detail-body a{color:var(--wp-amber)}
.tracker-loading p{color:rgba(255,255,255,.4);font-style:italic}
.tracker-embed{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);padding:1.2rem}
.tracker-err{color:var(--wp-red)}
.tracker-embed h1{font-size:1.4rem;font-weight:200;margin-bottom:.5rem;color:var(--wp-teal)}
.tracker-embed h2{font-size:1.1rem;font-weight:300;margin:.8rem 0 .3rem;color:rgba(255,255,255,.9)}
.tracker-embed h3{font-size:.95rem;font-weight:300;margin:.3rem 0;color:rgba(255,255,255,.7);border:none;padding:0;text-transform:none}
.tracker-embed ul{padding-left:1.5rem;margin:.3rem 0}
.tracker-embed li{font-size:.85rem;color:rgba(255,255,255,.6)}
.tracker-embed strong{color:rgba(255,255,255,.9);font-weight:600}
#g41-footer{position:relative;z-index:1;flex-shrink:0;text-align:center;padding:.4rem 1rem .6rem;font-size:.72rem;color:rgba(255,255,255,.25);line-height:1.5;background:rgba(0,0,0,.6)}
#g41-footer p+p{margin-top:.1rem}

/* ═══════════ CSS: boot loading（WP8 启动环） ═══════════ */
/* #g41-app 在数据到齐前是 opacity:0（G41.html 里的内联 <style>），这里补上那段时间的画面：
   **纯 CSS**，JS 到达前的第一帧就能显示。覆盖层是**不透明黑**——WP8 的启动画面本来就是
   纯色，而且背景立绘（全屏大图）会跟环抢视线；黑底也顺带保证文案的对比度。
   2026-10-12 第三版（维护者反馈「轨迹不对，小圆点没形成一条连贯的动画，各自为政」）：
   测量证实旧实现确实是散的——同一时刻五个点相邻间隔 96°/282°/81°/147°/114°。
   原因：每个点各自跑完整条 keyframes（含各自的停顿），相位差只保证均匀分布，不保证成链。
   现在改成**一条链**：五点共用同一条旋转曲线，只用负延迟错开相位（间距 24°），
   顺序永远不会乱；缓动曲线让弧长自然呼吸（WP8 的收放感），头大尾小让方向一眼可见。
   失败态由 G41.js 的 bootFailed() 把环换成一句话（环不能一直转——
   一直转就成了「还在读」的谎）。 */
#g41-loading{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;background:#000;color:var(--wp-amber);transition:opacity .35s ease}
#g41-loading.is-done{opacity:0;pointer-events:none}
#g41-loading.is-failed{color:rgba(255,255,255,.75)}
#g41-loading.is-failed .g41-ring{display:none}
.g41-ring{--dot:clamp(9px,1.7vmin,15px);position:relative;width:clamp(5.5rem,24vmin,11rem);height:clamp(5.5rem,24vmin,11rem)}
.g41-ring i{--size:var(--dot);position:absolute;inset:0;animation:g41-orbit 2.4s cubic-bezier(.5,.08,.5,.92) infinite}
.g41-ring i::after{content:"";position:absolute;left:50%;top:calc((var(--dot) - var(--size)) / 2);width:var(--size);height:var(--size);margin-left:calc(var(--size) / -2);border-radius:50%;background:currentColor}
.g41-ring i:nth-child(1){animation-delay:0s}
.g41-ring i:nth-child(2){--size:calc(var(--dot) * .85);animation-delay:-.16s}
.g41-ring i:nth-child(3){--size:calc(var(--dot) * .70);animation-delay:-.32s}
.g41-ring i:nth-child(4){--size:calc(var(--dot) * .55);animation-delay:-.48s}
.g41-ring i:nth-child(5){--size:calc(var(--dot) * .42);animation-delay:-.64s}
@keyframes g41-orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* 動きを減らす設定の利用者には**静止したリング**（5 点を 72° ずつ等間隔に）。
   回さないだけで「読み込み中」の意味は保つ（文案は下に出るので伝わる）。 */
@media (prefers-reduced-motion:reduce){
  .g41-ring i{animation:none}
  .g41-ring i:nth-child(1){transform:rotate(0deg)}
  .g41-ring i:nth-child(2){transform:rotate(72deg)}
  .g41-ring i:nth-child(3){transform:rotate(144deg)}
  .g41-ring i:nth-child(4){transform:rotate(216deg)}
  .g41-ring i:nth-child(5){transform:rotate(288deg)}
}
/* 起動中に出る**見える**文案。i18n はまだ読めていないので静的（二言語）。
   role="status" は親（#g41-loading）に付けてある。 */
.g41-load-txt{margin:0;font-size:.95rem;font-weight:300;letter-spacing:.08em;line-height:1.7;text-align:center;color:rgba(255,255,255,.85)}
.g41-load-msg{max-width:min(30rem,86vw);text-align:center;font-size:.9rem;font-weight:300;line-height:1.7;color:rgba(255,255,255,.8)}
.g41-load-msg .code{display:block;margin-top:.5rem;font-family:'Cascadia Code','Fira Code',monospace;font-size:.72rem;color:rgba(255,255,255,.45);word-break:break-all}
/* ═══════════ tiles.css（自 2026-10-12 起内联于此） ═══════════ */
/* ═══════════ CSS: tiles ═══════════ */
.tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;padding:.8rem;box-sizing:border-box}
@media(min-aspect-ratio:16/9){.tile-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-aspect-ratio:9/16){.tile-grid{grid-template-columns:repeat(2,1fr)}}
.tile{aspect-ratio:1;display:flex;flex-direction:column;justify-content:flex-end;padding:1.1rem;text-decoration:none;color:#fff;font-weight:400;font-size:1.5rem;border:2px solid transparent;transition:transform .12s,border-color .12s;overflow:hidden;cursor:pointer;position:relative;box-sizing:border-box}
.tile:active{transform:scale(.95)}
.tile:hover{border-color:rgba(255,255,255,.4)}
.tile-press{animation:tile-press .1s cubic-bezier(.16,1,.3,1) both}
@keyframes tile-press{0%{transform:scale(1)}30%{transform:scale(.92)}100%{transform:scale(.85);opacity:.6}}
.tile.flip-x{animation:tile-flip-x 1.8s cubic-bezier(.15,.85,.35,1.5) forwards}
.tile.flip-y{animation:tile-flip-y 1.8s cubic-bezier(.15,.85,.35,1.5) forwards}
.tile.flip-back-x{animation:tile-flip-x 1.8s cubic-bezier(.15,.85,.35,1.5) reverse forwards}
.tile.flip-back-y{animation:tile-flip-y 1.8s cubic-bezier(.15,.85,.35,1.5) reverse forwards}
@keyframes tile-flip-x{0%{transform:rotateX(0)}100%{transform:rotateX(180deg)}}
@keyframes tile-flip-y{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
.tile-icon{position:absolute;inset:0;font-size:3rem;line-height:1;display:flex;align-items:center;justify-content:center;opacity:.35;pointer-events:none;z-index:2}
.tile-label{font-size:1.8rem;font-weight:400;display:block;line-height:1.05;white-space:nowrap;letter-spacing:-1px;position:absolute;top:1.1rem;left:1.1rem;z-index:3}
.tile-desc{font-size:1.15rem;font-weight:700;opacity:.75;margin-top:.1rem;display:block;overflow:hidden;white-space:nowrap;position:relative;z-index:3;width:100%}
.tile-desc>span{display:inline-block}
.tile-desc.scroll-l>span{animation:marquee-l 3.7s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes marquee-l{0%,5%{transform:translateX(0)}40%,65%{transform:translateX(calc(-1*var(--dx)))}95%,100%{transform:translateX(0)}}
.tile-live{font-size:.75rem;font-weight:400;opacity:.55;margin-top:.25rem;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;position:relative;z-index:3;max-height:2.2rem}
.tile.flipped .tile-label,.tile.flipped .tile-desc,.tile.flipped .tile-icon,.tile.flipped .tile-live{opacity:0;transition:opacity .5s}
.tile-detail{position:absolute;inset:0;padding:1.8rem;display:flex;align-items:center;justify-content:center;font-size:.85rem;line-height:1.3;opacity:0;z-index:10;color:#fff;pointer-events:none;transition:opacity .5s;text-align:center;overflow:hidden;word-break:break-word;border-radius:inherit}
.tile.flipped .tile-detail{opacity:.85}
.t-wp-lime{background:var(--wp-lime)}.t-wp-green{background:var(--wp-green)}
.t-wp-emerald{background:var(--wp-emerald)}.t-wp-teal{background:var(--wp-teal)}
.t-wp-cobalt{background:var(--wp-cobalt)}.t-wp-indigo{background:var(--wp-indigo)}
.t-wp-magenta{background:var(--wp-magenta)}.t-wp-amber{background:var(--wp-amber)}
.t-wp-orange{background:var(--wp-orange)}
.app-list{display:flex;flex-direction:column}
.app-row{display:flex;align-items:center;gap:.8rem;padding:.8rem 0;border-bottom:1px solid rgba(255,255,255,.06);text-decoration:none;color:#fff;font-size:.95rem;transition:background .1s}
.app-row:hover{background:rgba(255,255,255,.04)}
.app-row-stack{animation:app-pop .18s cubic-bezier(.16,1,.3,1) both}
@keyframes app-pop{from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:translateY(0)}}
.app-icon{font-size:1.5rem;width:2.2rem;text-align:center;flex-shrink:0}
.app-icon img{width:1.2rem;height:1.2rem;vertical-align:middle}
.app-name{font-weight:600;min-width:5rem;flex-shrink:0}
.app-desc{font-size:.82rem;color:rgba(255,255,255,.45);flex:1}
/* ═══════════ hc.css（自 2026-10-12 起内联于此） ═══════════ */
/* ═══════════ CSS: high contrast ═══════════ */
/* tile colors computed dynamically from --wp-* vars */
.g41-hc .tile{border:3px solid #fff;font-weight:700;text-shadow:0 0 4px rgba(0,0,0,.8)}
.g41-hc .tile-label{font-size:1.8rem}.g41-hc .tile-desc{opacity:1;color:rgba(255,255,255,.85)}
.g41-hc .h-btn{color:#fff;border-color:#fff}
.g41-hc .lang-menu{background:#000;border-color:#fff}
.g41-hc .lang-opt{color:#fff;border-color:#fff}.g41-hc .lang-opt.active{background:#fff;color:#000}
.g41-hc .h-sub{color:#fff;font-weight:600}
.g41-hc #g41-character figcaption{color:#fff;font-weight:600;text-shadow:0 0 4px #000}
.g41-hc .d-back{border-color:#fff;color:#fff}
.g41-hc .d-title{color:#fff;font-weight:600}
.g41-hc .detail-body h3{color:#ff0;border-bottom-color:rgba(255,255,255,.5)}
.g41-hc .detail-body pre{background:#000;border:2px solid #fff;color:#0f0}
.g41-hc .detail-body code{color:#0f0}.g41-hc .detail-body a{color:#ff0;font-weight:700}
.g41-hc .app-row{border-bottom-color:rgba(255,255,255,.3)}.g41-hc .app-desc{color:rgba(255,255,255,.8)}
.g41-hc .detail-body p,.g41-hc .detail-body li{color:#fff}
.g41-hc .tracker-embed{background:#000;border:2px solid #fff}
.g41-hc .tracker-embed h1{color:#0f0}
.g41-hc .tracker-embed h2,.g41-hc .tracker-embed h3,.g41-hc .tracker-embed strong{color:#fff}
.g41-hc .tracker-embed li{color:rgba(255,255,255,.8)}
.g41-hc #g41-footer{color:#fff;background:#000;border-top:2px solid #fff}
.g41-hc #g41-bg img{opacity:.12;filter:none}
@media(max-width:500px){
  .h-title{font-size:2.2rem;letter-spacing:4px;padding:1rem 1rem 0}
  .tile-grid{grid-template-columns:repeat(2,1fr);padding:.3rem 1rem .5rem}
  .d-title{font-size:1.2rem}#g41-view-detail{padding:1rem}#g41-header{padding:.8rem 1rem .3rem}
  #g41-character{padding:0 1rem}
  .tile-label{font-size:1.4rem}.tile-desc{font-size:.9rem}.tile-icon{font-size:2.4rem}
}
</style>

<body>

<div id="g41-bg"><img id="g41-bg-img" src="/img/Pic_G41.png" alt=""></div>

<!-- 起動中のローディングリング（WP8 風）。#g41-app はデータが揃うまで opacity:0 なので、
     その間ずっと真っ黒だった。CSS だけで動く＝JS が来る前の最初の描画から出る。
     文案は**見える**が i18n はまだ読めていないので静的（二言語）。
     2026-10-12 第三版：覆盖层改不透明黑（加载期间不显示背景立绘），
     五点改成一条**链**（共用一条曲线、只错开相位），并在收环之后才播主视图入场动画。 -->
<div id="g41-loading" role="status">
  <div class="g41-ring" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <p class="g41-load-txt">読み込み中 / Loading</p>
</div>

<div id="g41-app">

  <div id="g41-view-main" class="g41-view g41-view--active">
    <header id="g41-header">
      <div class="h-title" id="g41-title">G41</div>
      <div class="h-controls">
        <div class="lang-drop">
          <button id="g41-lang" class="h-btn" title="Language">JA</button>
          <div id="g41-lang-menu" class="lang-menu"></div>
        </div>
        <button id="g41-contrast" class="h-btn" title="Contrast">&#9681;</button>
      </div>
    </header>
    <div class="h-sub" id="g41-greet"></div>
    <figure id="g41-character">
      <img id="g41-char-img" src="/img/Pic_G41.png" alt="G41">
      <figcaption id="g41-char-msg"></figcaption>
    </figure>
    <main id="g41-tiles" class="tile-grid"></main>
  </div>

  <div id="g41-view-detail" class="g41-view">
    <div class="detail-header">
      <button id="g41-back" class="d-back">&#x276e;</button>
      <span id="g41-detail-title" class="d-title"></span>
    </div>
    <div id="g41-detail-body" class="detail-body"></div>
  </div>

</div>

<footer id="g41-footer">
  <p>Powered by I.O.P. Manufacturing Company</p>
  <p>&copy;2053-2064&#12539;克鲁格和格里芬军事承包与安全顾问服务公司&#12539;&#1043;&#1088;&#1080;&#1092;&#1086;&#1085; &amp; &#1050;&#1088;&#1102;&#1075;&#1077;&#1088;&#12539;&#12464;&#12522;&#12501;&#12451;&#12531;</p>
</footer>

<!-- 顺序是**判据**，不是风格：G41.js 一执行就发起 6 个数据请求，回调里会调用
     tiles.js 定义的 closeDetail/buildTiles。若 tiles.js 排在后面，冷启动时数据可能先回来
