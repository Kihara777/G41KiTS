# AdGuard dnsproxy — hostPort 53/853（DoT），DoH 经 nginx 走 Service dns:53443
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns
  namespace: g41
  labels:
    app.kubernetes.io/part-of: g41
    app.kubernetes.io/name: dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns
  template:
    metadata:
      labels:
        app: dns
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: dns
          image: adguard/dnsproxy
          ports:
            - { name: dns-tcp, containerPort: 53, hostPort: 53, protocol: TCP }
            - { name: dns-udp, containerPort: 53, hostPort: 53, protocol: UDP }
            - { name: dot-tcp, containerPort: 853, hostPort: 853, protocol: TCP }
            - { name: dot-udp, containerPort: 853, hostPort: 853, protocol: UDP }
            - { name: doh, containerPort: 53443 }
          volumeMounts:
            - { name: certs, mountPath: /certs, readOnly: true }
            - { name: config, mountPath: /opt/dnsproxy/config.yaml, readOnly: true }
          resources:
            limits: { memory: 256Mi, cpu: "1" }
            requests: { memory: 128Mi, cpu: 250m }
          livenessProbe:
            exec:
              command: ["sh", "-c", "echo | nc -zw1 127.0.0.1 53 || exit 1"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: certs
          secret:
            secretName: g41-tls
            items:
              - { key: tls.crt, path: fc }
              - { key: tls.key, path: k }
        - name: config
          hostPath: { path: /opt/g41/.ns/config.yaml, type: FileOrCreate }
