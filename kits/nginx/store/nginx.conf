user  nginx;
worker_processes  auto;
pid /var/run/nginx.pid;
events { worker_connections  1024; }

quic_bpf on;

http
{
    charset utf-8;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    quic_retry on;
    quic_gso on;
    http3_hq on;

    limit_req_zone $binary_remote_addr zone=g41_rl:10m rate=30r/s;

    # 入口文档不落缓存。手机上的「刷新」在若干浏览器里会直接复用缓存副本，
    # 于是部署之后她看到的还是旧页（2026-10-12 实测：必须手动清缓存才看到新的启动环）。
    # 只对入口 HTML 用 no-store（每次重新取；gzip 后约 6.9KB）；
    # 其余静态资源维持 no-cache + ETag —— 304 很便宜，而且不会配出「旧 HTML 配新 JS」。
    map $uri $g41_cache_control {
        default              "no-cache";
        "~^/(?:G41\.html)?$" "no-store";
    }

    # splash 文案的本地化（2026-10-12）。约束是硬的：文案必须**在任何 JS 与任何额外请求之前**
    # 就可读——客户端脚本要么来得太晚（还要多一次往返），要么被 CSP 拦（script-src 是 'self'）。
    # 所以按 Accept-Language 在 nginx 侧替换。第一语言优先，与 G41.js 的 detectLang 同规则；
    # 代价：它看不到 localStorage 里的偏好（app 启动后立刻按偏好显示，splash 只差那一两秒）。
    # 被替换的串是 HTML 里那行双语兜底 —— 改文案要两处一起改。
    map $http_accept_language $g41_loading_text {
        default       "Loading";
        "~*^\s*zh"    "载入中";
        "~*^\s*ja"    "読み込み中";
        "~*^\s*en"    "Loading";
    }

    # 压缩。2026-10-12 加入：此前**一个 gzip 指令都没有**（nginx 默认 gzip off），
    # 首页 HTML（样式已内联，约 19.7KB）与 JS 都是原样发送。实测本仓的
    # G41.html 压到 6.9KB、G41.js 7.0KB→约 2KB —— 在移动链路上这是最直接的一刀。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary off;                     # Vary 由 server 块合成一个头（见下），免得出现两个 Vary
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    
    include /etc/nginx/conf.d/zones/*.conf;
    include /etc/nginx/conf.d/upstreams/*.conf;

    server 
    {
        listen 80 ipv6only=off default_server;
        server_name _;
        location = /41 { return 204; }
        location = /img/Pic_G41_Dhx.png { root /webroot/G41; }
        location / { return 301 https://$host$request_uri; }
    }
    
    server
    {
        # listen [::]:443 ipv6only=off quic reuseport so_keepalive=on default_server;
        listen 443 ipv6only=off ssl reuseport so_keepalive=on default_server;
        server_name _;
        ssl_certificate     /certs/fc;
        ssl_certificate_key /certs/k;
        ssl_protocols TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
        # 静态文件一律「可缓存，但要再验证」。原先一个 Cache-Control 都没有，浏览器就按
        # Last-Modified 走**启发式缓存**（10% 新鲜期）→ 部署之后可能拿到「旧 HTML 配新 JS」
        # 的混合体：2026-10-12 维护者正是因此看不到新加的启动环（页面看起来什么都没变）。
        # 本站没有文件名指纹，所以 no-cache + ETag（304 很便宜）是唯一不会发出混合体的做法。
        # 入口 HTML 更严：no-store（见 http 块里的 $g41_cache_control map）——手机上的「刷新」
        # 不保证再验证，只有根本不落盘才挡得住旧文档。
        add_header Cache-Control $g41_cache_control always;
        # 响应随 Accept-Language 变化（splash 文案本地化），所以 Vary 里要写上它。
        # gzip_vary 已关，这里合成一个 Vary 头，避免同一响应出现两个。
        add_header Vary "Accept-Encoding, Accept-Language" always;
        # splash 文案本地化：把 HTML 里那行双语兜底换成对应语言（map 见 http 块）。
        # sub_filter_once 默认 on；这里显式写出，因为「只替换第一处」是它的语义关键。
        sub_filter_once on;
        sub_filter '読み込み中 / Loading' $g41_loading_text;

        root /webroot/G41;
        index G41.html;
        error_page 404 /G41.html;
        error_page 500 502 504 /G41.html;
        include /etc/nginx/conf.d/locations/*.conf;
    }

    include /etc/nginx/conf.d/servers/*.conf;
}