# hexo — compose=file，镜像 g41k8s/hexo:local
# Service 名 "hx"（对应 nginx upstream "bx { server hx:4000; }" 使用容器名缩写）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexo
  namespace: g41
  labels:
    app.kubernetes.io/part-of: g41
    app.kubernetes.io/name: hexo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hexo
  template:
    metadata:
      labels:
        app: hexo
    spec:
      containers:
        - name: hexo
          image: g41k8s/hexo:local
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 4000 }
          volumeMounts:
            - { name: source, mountPath: /blog/source }
            - { name: themes, mountPath: /blog/themes }
            - { name: scaffolds, mountPath: /blog/scaffolds }
          resources:
            limits: { memory: 256Mi, cpu: "1" }
            requests: { memory: 32Mi, cpu: 50m }
          livenessProbe:
            exec:
              command: ["sh", "-c", "wget -q -O /dev/null http://127.0.0.1:4000/ || exit 1"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: source
          hostPath: { path: /opt/g41/.hx/source, type: DirectoryOrCreate }
        - name: themes
          hostPath: { path: /opt/g41/.hx/themes, type: DirectoryOrCreate }
        - name: scaffolds
          hostPath: { path: /opt/g41/.hx/scaffolds, type: DirectoryOrCreate }
