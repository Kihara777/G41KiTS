server 
{
    listen 80;
     server_name log.*;
    location / { return 301 https://$host$request_uri; }
}

server
{
    listen 443 ssl;
    server_name log.*;

    include /etc/nginx/conf.d/locations/000-home.conf;

    location /
    {
        # k8s：静态文件优先（hexo generate 输出于 /webroot/hexo）
        # compose：无静态文件时回退代理 hexo server（行为不变）
        root /webroot/hexo;
        try_files $uri $uri/ @hexo_fallback;
    }

    location @hexo_fallback
    {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_pass http://bx;
    }
}
