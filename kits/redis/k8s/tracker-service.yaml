# tracker Service — 指向 api 容器（tracker 与 api 同进程，端口 8000）
# 名称保持 tracker：nginx upstream "wt { server tracker:8000; }" 不变
apiVersion: v1
kind: Service
metadata:
  name: tracker
  namespace: g41
  labels:
    app.kubernetes.io/part-of: g41
    app.kubernetes.io/name: tracker
spec:
  selector:
    component: api
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
