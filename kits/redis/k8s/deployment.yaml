# redis + api(+tracker) 合一 Pod：省 Pod 开销；api 与 tracker 同进程（entry.js）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: g41
  labels:
    app.kubernetes.io/part-of: g41
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: api
    spec:
      containers:
        - name: redis
          image: redis
          args:
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--save"
            - "900"
            - "1"
            - "--save"
            - "300"
            - "10"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          env:
            # 必须 NOT optional：若 g41-env 中缺少 REDIS_PASSWORD，Kubernetes 会把
            # 变量注入为**空字符串**而不是报错，于是 redis 以 `--requirepass ""`
            # 启动、api 无法认证 —— 表现为 /data/* 返回 502 而 pod 仍显示 Running。
            # 曾经因此踩坑：.env 缺该键 → secret 无该键 → 静默半失效。
            # 去掉 optional 后，缺键会让 Pod 直接 Pending 并给出明确的
            # "secret ... not found / key not found" 错误，暴露问题而非掩盖。
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: g41-env, key: REDIS_PASSWORD }
          ports:
            - { containerPort: 6379 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            limits: { memory: 256Mi, cpu: "1" }
            requests: { memory: 32Mi, cpu: 50m }
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
        - name: api
          image: g41k8s/redis:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["/app/entry.js"]
          env:
            - { name: NODE_OPTIONS, value: "--max-old-space-size=128" }
            - { name: REDIS_HOST, value: redis }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: g41-env, key: REDIS_PASSWORD }
            - name: G41_DOMAIN
              valueFrom:
                secretKeyRef: { name: g41-env, key: G41_DOMAIN, optional: true }
            - name: RELOAD_SECRET
              valueFrom:
                secretKeyRef: { name: g41-env, key: RELOAD_SECRET, optional: true }
          ports:
            - { containerPort: 5800 }
            - { containerPort: 8000 }
          volumeMounts:
            - { name: server-js, mountPath: /app/server.js, subPath: server.js, readOnly: true }
            # 内容种子（2026-11-08）：tile/i18n 类模块的内容由 ConfigMap 供给，
            # 启动/重载时被还原成目录布局再读进 Redis。
            # 2026-11-09 起**不再挂宿主 /conf-data**：同一批内容有两个产地时，
            # 宿主那份会掩盖种子的问题（改了宿主、或种子没生效，都看不出来）。
            # 现在内容是单一来源，出问题只有一种解释。
            # 代价写清楚：`g41-content` 缺失时不再是「少几个磁贴」，而是内容全空——
            # 所以 CD 里在 apply workloads 之前先生成并应用它。
            - { name: seed, mountPath: /seed, readOnly: true }
          resources:
            limits: { memory: 256Mi, cpu: "1" }
            requests: { memory: 32Mi, cpu: 50m }
          livenessProbe:
            exec:
              command: ["sh", "-c", "wget -q -O /dev/null http://127.0.0.1:5800/data/tiles || exit 1"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          hostPath: { path: /opt/g41/.rd, type: DirectoryOrCreate }
        - name: server-js
          # 2026-11-09：源码改由 ConfigMap 供给（`kits api-src` 生成，CD 应用）。
          # 此前是宿主机单文件 /opt/g41/.rd/server.js，靠人手工 cp——而实测两者
          # inode 不同源：改仓库、重启、日志干净、站点正常，跑的却还是旧代码。
          # 用 subPath 只挂 server.js 这一个键，不遮蔽 /app 下的其它文件。
          configMap: { name: g41-api-src }
        - name: seed
          configMap: { name: g41-content, optional: true }
