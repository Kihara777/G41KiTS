# aria2 Service — 对应 nginx upstream "ar { server aria2:6800; }"
apiVersion: v1
kind: Service
metadata:
  name: aria2
  namespace: g41
  labels:
    app.kubernetes.io/part-of: g41
    app.kubernetes.io/name: aria2
spec:
  selector:
    app: aria2
  ports:
    - { name: rpc, port: 6800, targetPort: 6800 }
