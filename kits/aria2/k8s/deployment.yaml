# aria2 — compose=file，镜像 g41k8s/aria2:local（RPC 端口仅集群内）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aria2
  namespace: g41
  labels:
    app.kubernetes.io/part-of: g41
    app.kubernetes.io/name: aria2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aria2
  template:
    metadata:
      labels:
        app: aria2
    spec:
      containers:
        - name: aria2
          image: g41k8s/aria2:local
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 6800 }
          volumeMounts:
            - { name: rpc, mountPath: /aria2/rpc.daemon, readOnly: true }
            - { name: webroot, mountPath: /webroot }
          resources:
            limits: { memory: 512Mi, cpu: "2" }
            requests: { memory: 256Mi, cpu: 500m }
          livenessProbe:
            exec:
              command: ["sh", "-c", "nc -zw1 127.0.0.1 6800 || exit 1"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: rpc
          hostPath: { path: /opt/g41/.ad/rpc.daemon, type: FileOrCreate }
        - name: webroot
          hostPath: { path: /opt/g41/.wr, type: DirectoryOrCreate }
