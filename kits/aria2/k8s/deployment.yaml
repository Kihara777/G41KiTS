# aria2 + bt 合一 Pod（下载器组，共享 webroot /opt/g41/.wr）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: download
  namespace: g41
  labels:
    app.kubernetes.io/part-of: g41
    app.kubernetes.io/name: download
spec:
  replicas: 1
  selector:
    matchLabels:
      app: download
  template:
    metadata:
      labels:
        app: download
    spec:
      containers:
        - name: aria2
          image: g41k8s/aria2:local
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 6800 }
          volumeMounts:
            - { name: rpc, mountPath: /aria2/rpc.daemon, readOnly: true }
            - { name: webroot, mountPath: /webroot }
          resources:
            limits: { memory: 512Mi, cpu: "2" }
            requests: { memory: 64Mi, cpu: 100m }
          livenessProbe:
            exec:
              command: ["sh", "-c", "nc -zw1 127.0.0.1 6800 || exit 1"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
        - name: bt
          image: g41k8s/bt:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: peer-tcp, containerPort: 51413, hostPort: 51413, protocol: TCP }
            - { name: peer-udp, containerPort: 51413, hostPort: 51413, protocol: UDP }
            - { name: rpc, containerPort: 9091 }
          volumeMounts:
            - { name: settings, mountPath: /bt/settings.json, readOnly: true }
            - { name: webroot, mountPath: /webroot }
          resources:
            limits: { memory: 512Mi, cpu: "2" }
            requests: { memory: 64Mi, cpu: 100m }
          livenessProbe:
            exec:
              command: ["sh", "-c", "nc -zw1 127.0.0.1 9091 || exit 1"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: rpc
          hostPath: { path: /opt/g41/.ad/rpc.daemon, type: FileOrCreate }
        - name: settings
          hostPath: { path: /opt/g41/.tr/settings.json, type: FileOrCreate }
        - name: webroot
          hostPath: { path: /opt/g41/.wr, type: DirectoryOrCreate }
